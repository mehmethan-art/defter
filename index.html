<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defter · Halıcızade</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Defter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--zemin:#f6f2ec;--kart:#fff;--yazi:#2b2622;--soluk:#7a6f66;--cizgi:#e3dcd3;--vurgu:#7a2e2a;--vurgu-acik:#f3e6e3}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--zemin);color:var(--yazi);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
  .kap{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 32px}
  .ust{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .ust img{width:52px;height:52px;border-radius:14px}
  .marka{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--soluk)}
  h1{margin:2px 0 0;font-size:24px}
  .selam{color:var(--soluk);margin:0 0 18px;font-size:15px}
  .secim{display:flex;align-items:center;gap:16px;width:100%;text-decoration:none;color:inherit;background:var(--kart);
    border:1px solid var(--cizgi);border-radius:18px;padding:20px 18px;margin:0 0 12px;transition:transform .12s ease}
  .secim:active{transform:scale(.98)}
  .secim:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
  .simge{flex:none;width:52px;height:52px;border-radius:14px;background:var(--vurgu-acik);color:var(--vurgu);
    display:flex;align-items:center;justify-content:center}
  .simge svg{width:28px;height:28px}
  .yazi b{display:block;font-size:19px}
  .yazi span{display:block;color:var(--soluk);font-size:14px;margin-top:2px}
  .ok{margin-left:auto;color:var(--soluk);font-size:26px;line-height:1}
</style>
</head>
<body>
<div class="kap">
  <div class="ust">
    <img src="icon-192.png" alt="">
    <div><div class="marka">Halıcızade</div><h1>Defter</h1></div>
  </div>
  <p class="selam" id="selam">Ne yapmak istiyorsunuz?</p>

  <a class="secim" href="servis.html">
    <span class="simge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14.5h3"/></svg>
    </span>
    <span class="yazi"><b>Servis Defteri</b><span>Evde deneme, teslimat, yıkama, keşif</span></span>
    <span class="ok" aria-hidden="true">›</span>
  </a>

  <a class="secim" href="kunye.html">
    <span class="simge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </span>
    <span class="yazi"><b>Halı Künyesi</b><span>Mağazaya gelen halının kimliği</span></span>
    <span class="ok" aria-hidden="true">›</span>
  </a>
</div>
<script>
  (function () {
    var ad = '';
    try { ad = (localStorage.getItem('hz_servis_kim') || localStorage.getItem('hz_kunye_acan') || '').trim().split(' ')[0]; } catch (e) {}
    if (ad) document.getElementById('selam').textContent = 'Merhaba ' + ad + ', ne yapmak istiyorsunuz?';
  })();
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
</html>
